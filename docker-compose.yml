version: '3.8'

services:
  # ==========================================
  # 1. SecureDoc AI Web Application (FastAPI)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securedoc_ai_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/securedoc_ai
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ==========================================
  # 2. Enterprise Database (PostgreSQL 16)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: securedoc_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securedoc_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securedoc_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. Local On-Premise LLM Engine (Ollama)
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: securedoc_ai_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  postgres_data:
  ollama_models:
